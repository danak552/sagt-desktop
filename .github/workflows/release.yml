name: Release

on:
  workflow_dispatch: # Manual trigger — test builds without publishing
  push:
    tags:
      - 'v*' # Only automatic trigger: version tag (e.g. v1.0.0)

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCS_ARTIFACTS_SA_KEY }}'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Sidecar Resources (GCS)
        working-directory: ./src-tauri
        run: |
          New-Item -ItemType Directory -Force -Path binaries
          New-Item -ItemType Directory -Force -Path resources/models

          Write-Host "Downloading Model from GCS..."
          gcloud storage cp gs://swedish-whisper-engine-artifacts/ggml-kb-whisper-small.bin resources/models/ggml-kb-whisper-small.bin --project swedish-whisper-engine

          Write-Host "Downloading Binaries Zip from GCS..."
          gcloud storage cp gs://swedish-whisper-engine-artifacts/whisper-binaries.zip whisper.zip --project swedish-whisper-engine

          Write-Host "Extracting binaries..."
          Expand-Archive -Path "whisper.zip" -DestinationPath "binaries" -Force
          Remove-Item -Path "whisper.zip" -Force

          Write-Host "Ensuring required DLLs exist..."
          $dlls = @("whisper.dll", "ggml.dll", "ggml-base.dll", "ggml-cpu.dll", "SDL2.dll")
          foreach ($dll in $dlls) {
            if (-not (Test-Path "binaries/$dll")) {
              Write-Host "Mocking missing DLL: $dll"
              New-Item -ItemType File -Force -Path "binaries/$dll"
            }
          }

      - name: Build Raw Binary
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        run: npm run tauri build -- --no-bundle

      - name: Sign Inner Executable
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://neu.codesigning.azure.net/'
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: 'src-tauri/target/release'
          files-folder-filter: 'sagt.exe'

      # azure/trusted-signing-action does NOT support comma-separated filters.
      # Use one step per file type.
      - name: Sign Sidecar Executables
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://neu.codesigning.azure.net/'
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: 'src-tauri/binaries'
          files-folder-filter: 'exe'

      - name: Sign Sidecar DLLs
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://neu.codesigning.azure.net/'
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: 'src-tauri/binaries'
          files-folder-filter: 'dll'

      - name: Backup Signed Binary
        run: |
          Copy-Item "src-tauri/target/release/sagt.exe" "src-tauri/target/release/sagt.exe.signed"
          Write-Host "Backed up signed sagt.exe"

      - name: Bundle NSIS Installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        run: npm run tauri build

      # Tauri recompiles sagt.exe during bundling (unsigned). We restore the
      # Azure-signed binary and rebuild only the NSIS installer.
      # CRITICAL: TAURI_SIGNING_PRIVATE_KEY must be empty here — if it changes
      # between steps Cargo triggers a recompile and overwrites the signed binary.
      - name: Restore Signed Binary and Rebuild NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        run: |
          Copy-Item "src-tauri/target/release/sagt.exe.signed" "src-tauri/target/release/sagt.exe" -Force
          Write-Host "Restored signed sagt.exe — rebuilding NSIS bundle..."
          npx tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":""}}'

      - name: Sign Outer Installer
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://neu.codesigning.azure.net/'
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: 'src-tauri/target/release/bundle/nsis'
          files-folder-filter: 'exe'

      # ed25519 signature is created AFTER Azure signing so the .sig matches
      # the final installer bytes (Azure modifies the file). Uses tauri signer
      # CLI — does not trigger a Cargo recompile.
      - name: Sign Update Bundle (ed25519)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe `
            | Select-Object -First 1
          $sigFile = "$($exe.FullName).sig"
          Write-Host "Creating ed25519 signature for $($exe.Name)..."
          npx --yes @tauri-apps/cli signer sign `
            --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" `
            --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" `
            "$($exe.FullName)"
          if (Test-Path $sigFile) {
            Write-Host "Signature created: $sigFile"
            exit 0
          } else {
            Write-Error "Signing failed — .sig file was not created"
            exit 1
          }

      - name: Publish Update Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $version = $env:GITHUB_REF -replace "refs/tags/v", ""
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe `
            | Select-Object -First 1
          $sigFile = "$($exe.FullName).sig"
          if (-not (Test-Path $sigFile)) {
            Write-Warning "No .sig file found — skipping manifest."
            exit 0
          }
          $sig = (Get-Content $sigFile -Raw).Trim()
          $manifest = [ordered]@{
            version   = $version
            notes     = "https://github.com/danak552/sagt-desktop/releases/tag/v$version"
            pub_date  = (Get-Date -Format "o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url       = "https://downloads.sagt.ai/Sagt.ai-$version-x64-setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 4
          $manifest | Out-File "update-manifest.json" -Encoding utf8NoBOM
          Write-Host "Publishing update-manifest.json (v$version) to R2..."
          npx --yes wrangler@latest r2 object put `
            "sagt-downloads/update-manifest.json" `
            --file="update-manifest.json" `
            --remote `
            --content-type "application/json" `
            --cache-control "public, max-age=300"

      - name: Publish to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe `
            | Select-Object -First 1
          $version = $env:GITHUB_REF -replace "refs/tags/v", ""
          Write-Host "Publishing $($exe.Name) to R2..."

          npx --yes wrangler@latest r2 object put `
            "sagt-downloads/Sagt.ai-setup.exe" `
            --file="$($exe.FullName)" `
            --remote `
            --content-type "application/vnd.microsoft.portable-executable" `
            --cache-control "public, max-age=300"

          npx --yes wrangler@latest r2 object put `
            "sagt-downloads/Sagt.ai-$version-x64-setup.exe" `
            --file="$($exe.FullName)" `
            --remote `
            --content-type "application/vnd.microsoft.portable-executable" `
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sagt-Desktop-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sagt.ai Desktop ${{ github.ref_name }}
          body: |
            ## Sagt.ai Desktop ${{ github.ref_name }}

            ### Install
            1. Download `Sagt_${{ github.ref_name }}_x64-setup.exe` below
            2. Run the installer — signed with Azure Trusted Signing, no SmartScreen warning
            3. Launch Sagt.ai from the Start menu

            The app auto-updates in the background for future releases.

            ---
            **Free tier:** local KB-Whisper transcription, zero cloud dependency.
            **Pro (199 kr/month):** AI meeting protocol via Berget.ai (EU). [sagt.ai](https://sagt.ai)
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
