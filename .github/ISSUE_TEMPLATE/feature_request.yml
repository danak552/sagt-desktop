name: Feature Request
description: Suggest something new
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are read and considered. No promises on timeline — this is a solo project.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you feel something is missing or painful
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the behaviour or feature you want
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Which tier is this relevant for?
      options:
        - Free (local transcription)
        - Pro (cloud sync + AI protocol)
        - Both
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered (optional)
      description: Any workarounds you're using today
