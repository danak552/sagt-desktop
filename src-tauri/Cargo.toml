[package]
name = "sagt"
# Medvetet 0.0.0 — INTE appens version. tauri.conf.json:s `version` är sanningskällan
# och vinner alltid när fältet finns där; detta fält läses varken av bundlern, av CI
# eller av koden (inget env!("CARGO_PKG_VERSION") finns). Fältet stod tidigare på 0.9.5
# medan appen var på 0.9.42, vilket bara gav "Compiling sagt v0.9.5" i byggloggarna och
# fick folk att tro att versionerna glidit isär. Att i stället synka det manuellt hade
# lagt till en fjärde fil att glömma vid varje bump — se desktop/CLAUDE.md om varför den
# sortens duplicering redan orsakat tyst fel en gång (PostHogProvider).
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
crossbeam-channel = "0.5"
rubato = "0.14"
anyhow = "1.0"
hound = "3.5"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["sync"] }
num-traits = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_rusqlite = "0.35"
chrono = { version = "0.4", features = ["serde"] }
# Direkt windows-dep för WASAPI-peakmetrar (audio_meter.rs). cpal drar in en egen
# äldre windows-version transitivt — olika major-versioner samexisterar i Cargo.
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }

[features]
devtools = ["tauri/devtools"]

